services:
  gifs:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8788:8000"
    volumes:
      - gifs-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  gifs-data:
